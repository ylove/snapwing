name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository is public, so hosted minutes are free. CI is two jobs:
# - `checks` (always, about a minute): does the change touch code, prose lint (D9), gitleaks.
# - `test` (any change that touches code, on a pull request or a push to `main`): one job runs lint, both
#   dialects, and `state rebuild --verify` in sequence, so setup and install are paid once. Merges are
#   gated here, and the run on `main` catches two pull requests that are green alone but break together.
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does the change touch code?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BEFORE}...HEAD")
          else
            changed="unknown-base" # new branch or force push: no base to diff, so assume code
          fi
          if echo "$changed" | grep -Evq '(\.md$|^docs/|^build/|^$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$changed"
      # Node built-ins only, so no install is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prose lint
        run: node scripts/lint-prose.mjs
      # No secret is ever committed. Scans the history of the commit under test
      # (`--log-opts HEAD`), so a fake value on another branch does not fail this one.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose --log-opts=HEAD

  test:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapwing
          POSTGRES_PASSWORD: snapwing
          POSTGRES_DB: snapwing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snapwing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: test (sqlite)
        env:
          SNAPWING_DB: sqlite
        run: pnpm test && pnpm test:contract
      - name: pack and npx (sqlite)
        env:
          SNAPWING_DB: sqlite
        run: pnpm test:pack
      - name: test (postgres)
        if: success() || failure()
        env:
          SNAPWING_DB: postgres
          DATABASE_URL: postgres://snapwing:snapwing@localhost:5432/snapwing
        run: pnpm test && pnpm test:contract
      - name: state rebuild --verify (sqlite and postgres)
        if: success() || failure()
        env:
          DATABASE_URL: postgres://snapwing:snapwing@localhost:5432/snapwing
        run: |
          if ! find demo -type f ! -name '.gitkeep' | grep -q .; then
            echo "demo/ has no recordings yet; skipping."
            exit 0
          fi
          DATABASE_URL= SNAPWING_DB=sqlite pnpm state rebuild --verify --seed demo/state
          SNAPWING_DB=postgres pnpm state rebuild --verify --seed demo/state
